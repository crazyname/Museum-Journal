ext-align:left;padding:13px 17px;margin:7px 0;gap:14px}.family-specimen:hover{background:rgba(228,217,183,.7)}.family-specimen span{font:24px var(--hand)}.family-specimen small{font:italic 12px Georgia,serif;color:#7a6e59}.minor-note{font-size:14px;color:#655e50}.breadcrumbs{font:14px var(--hand);color:#7e6b4e;margin:0 0 15px}.breadcrumbs button{border:0;padding:0;background:none;color:inherit;text-decoration:underline;text-underline-offset:3px}.chapter-guide{font-size:14px;color:#5c5a4a}.book .toc-row{cursor:pointer}

<script>
'use strict';
const lessons = [
 {id:'overview',title:'先看植物的谱系',en:'THE LIVING KINGDOM',tag:'第一课 · 分类总览',lead:'辨认一株植物，不必从背诵名字开始。先观察它用什么方式繁殖，再看叶、茎、花与果实。',figure:'植物类群的分支手绘图',focus:'你会学到：区别孢子植物与种子植物，理解裸子植物与被子植物，并了解“单子叶植物”不是仅凭叶脉就能判定的标签。',body:[['从哪里开始？','常见陆生植物可先按观察线索认识：苔藓类常无真正的维管组织；石松类和蕨类具有维管组织，通常靠孢子繁殖；种子植物则形成种子。'],['种子藏在哪里？','裸子植物的胚珠与种子不包藏在由子房发育而成的果实内；被子植物具有花，其胚珠位于子房中，受精后可形成果实。松与银杏是典型裸子植物，荷与桂花是被子植物。'],['为什么不直接按“树、花、草”分类？','树木、灌木与草本描述的是生长型，不能直接表示亲缘关系。植物分类学更重视可比较的生殖结构与系统发育证据。']],cues:[['苔藓类','寻找孢蒴，注意小型群生状态。'],['蕨类','留意叶背的孢子囊群。'],['裸子植物','观察球果或裸露的胚珠结构。'],['被子植物','观察花、果实与叶的组合特征。']],question:'观察任务：在你常走的一段路上，找出一种没有显眼花朵的植物，判断“没有看到花”是否等于“不会开花”。'},
 {id:'leaf-shape',title:'叶的轮廓',en:'LEAF MORPHOLOGY',tag:'第二课 · 叶形与叶缘',lead:'一片叶，往往是植物最容易被观察到的识别线索。它的外轮廓，比你想象中更有信息量。',figure:'不同叶形、叶尖、叶缘对照图',focus:'把叶形、叶缘与叶尖分开记录；不要只凭叶形单独鉴定植物。',body:[['先分单叶与复叶','单叶有一片连续叶片；复叶的叶片分裂为若干小叶。复叶的小叶通常不具有腋芽，而整片叶与茎连接的叶腋可观察腋芽。'],['记录轮廓','常见形容词有卵形、椭圆形、披针形、心形、扇形和线形。请同时观察叶基与叶尖：例如心形叶基、渐尖叶尖。'],['把边缘单独写下来','叶缘可以是全缘、锯齿缘、波状缘或深裂等。裂片仍可能属于同一片单叶，不一定就是复叶。']],cues:[['扇形','银杏的叶是经典实例。'],['掌状复叶','多个小叶从叶柄末端集中伸出。'],['羽状复叶','小叶沿共同叶轴排列。'],['锯齿缘','叶片边缘有规则的小齿。']],question:'观察任务：找两片相似的叶，分别记录叶形、叶尖、叶基和叶缘四项信息。'},
 {id:'leaf-arrange',title:'叶怎样站在枝上',en:'PHYLLOTAXIS',tag:'第三课 · 叶序与叶脉',lead:'不要只看一片叶；把眼光移到整根枝条，你才会发现叶子彼此之间的秩序。',figure:'互生、对生、轮生及叶脉手绘图',focus:'叶序描述叶在茎节上的排列；叶脉描述叶片内部的维管束走向。',body:[['叶序','互生：每个节通常着生一叶；对生：同一节相对着生两叶；轮生：一个节上通常着生三叶或更多。观察时先确认你看到的是一根枝条，而不是许多交叠的枝。'],['叶脉','羽状脉有明显中脉与侧脉；掌状脉有多条主脉从叶基附近辐射；平行脉常见于多种单子叶植物；银杏具有引人注目的二歧分叉脉。'],['小心例外','单子叶植物并非全部平行脉，真双子叶植物也不一定全为网状脉。叶序、叶脉都应与花、果实等共同判断。']],cues:[['互生','多数节上见一叶。'],['对生','两叶在同一节相对。'],['平行脉','多条叶脉大体纵向延伸。'],['二歧脉','叶脉反复分成两支。']],question:'观察任务：沿一根枝条数三个连续节，画出叶子着生的位置。'},
 {id:'flower',title:'一朵花的解剖',en:'ANATOMY OF A FLOWER',tag:'第四课 · 花部结构',lead:'花不仅有颜色，也有可以阅读的结构。数一数花被、雄蕊与心皮，会比只记住颜色更可靠。',figure:'花瓣、花萼、雄蕊、雌蕊解剖图',focus:'学会辨认花萼、花冠、雄蕊、雌蕊；注意“花瓣”与“花被片”并不总是同一个说法。',body:[['基本花部','典型花可具有花萼、花冠、雄蕊与雌蕊。花萼常起保护作用，花冠常较显眼，但不同植物可能缺少某些花部或花部彼此相似。'],['对称性','辐射对称花可以经多个通过花心的平面分为相似两半；两侧对称花通常只有一个这样的对称平面。豌豆一类的蝶形花冠就是后者的常见例子。'],['花的数目','数花被片和雄蕊时，先确认你看到的确是一朵花，而不是由许多小花密集排列成的花序。']],cues:[['花萼','常位于花冠外侧。'],['雄蕊','通常由花丝与花药组成。'],['雌蕊','包括柱头、花柱与子房等。'],['两侧对称','仅一个主要对称平面。']],question:'观察任务：在不采摘的情况下拍下一朵花，尝试数清花被片和雄蕊。'},
 {id:'inflorescence',title:'一朵，还是一群花',en:'INFLORESCENCE',tag:'第五课 · 花序与果实',lead:'路边一颗黄色“花头”，可能是一整组极小花朵。真正有趣的地方，往往藏在整体的边界内。',figure:'总状、穗状、头状、伞形花序图',focus:'区分单生花与花序，识别头状花序与总状花序的常见外观。',body:[['花序是什么？','多朵花依一定方式着生在花序轴上，就构成花序。常见类型包括总状、穗状、伞形、圆锥和头状花序。具体分类还会更复杂。'],['向日葵的秘密','向日葵显眼的“花盘”其实是头状花序，外围常见舌状花，中央密集着生管状花。外表看似一朵，结构上却是许多小花。'],['果实也是线索','果实通常由子房在受精后发育形成，类型繁多。真正的果实结构与日常说的“水果”并非完全一一对应。']],cues:[['总状花序','花常有花梗，沿主轴排列。'],['穗状花序','花常无明显花梗。'],['头状花序','众多小花密集成“花头”。'],['圆锥花序','分枝的复合花序。']],question:'观察任务：仔细看一朵向日葵，区分花盘中央与外围两种小花的形态。'},
 {id:'stem-root',title:'根与茎的线索',en:'STEM & ROOT',tag:'第六课 · 营养器官',lead:'看不见的根负责锚定与吸收；看得见的茎托举叶和花。结构并不只是一道外形题。',figure:'直根系、须根系、地下茎与气生根图',focus:'学会区分直根系与须根系，并意识到地下器官不一定都是根。',body:[['根系','许多双子叶植物有明显的主根与侧根组成直根系；许多单子叶植物形成以不定根为主的须根系。但仅凭根系外形不能决定植物全部分类。'],['茎的节与节间','叶和芽通常着生在茎的节上，节与节之间为节间。地下的根状茎、块茎等仍保留茎的某些结构特征。'],['特殊适应','某些榕属植物可以形成气生根；有些植物具有匍匐茎或地下贮藏器官。不要把气生根和垂下来的枝条混为一谈。']],cues:[['直根系','有较明显的主根。'],['须根系','粗细较近似的根较多。'],['节','叶、芽常在这里着生。'],['气生根','在地上部分形成并伸向空气。']],question:'观察任务：找一株禾本科植物，观察叶鞘与茎节，而不必破坏植株。'},
 {id:'method',title:'怎样写一张标本卡',en:'FIELD METHOD',tag:'第七课 · 观察方法',lead:'一本好的博物学笔记，不只记录结论。它还忠实保存你看到什么、在何时何地看到，以及哪些地方尚不确定。',figure:'植物观察卡与铅笔记录版式',focus:'练习以可复核的方式记录观察；保护生境，优先拍照和速写，不随意采挖。',body:[['一页应写什么？','记录观察日期、地点（只需你愿意公开的精度）、生境、植株高度范围、叶序、叶形、花果特征及气味等。需要用手触摸或采集时先考虑安全与保护要求。'],['分开“观察”与“推测”','例如：“看见三片心形小叶”是观察；“所以它一定是三叶草”是推测。新手最常见的错误，是把常见俗名当成严格鉴定结论。'],['留下不确定性','写“疑似”“待核实”是良好的科学态度。若涉及毒性、药用、食用，不能仅靠本书判断。']],cues:[['时间','日期、季节、天气。'],['地点','林缘、道路、湿地、草坪。'],['形态','叶、茎、花、果、根。'],['证据','照片编号与检索来源。']],question:'观察任务：为你今天看见的一株植物填写一张至少含六个字段的记录卡。'}
];

// The morphology curriculum is intentionally distinct from the small illustrated identification key.
const rootLesson={id:'root-study',title:'根系与地下器官',en:'ROOT SYSTEMS & UNDERGROUND ORGANS',tag:'第二章 · 根系',lead:'先确定你看到的是根还是地下茎，再观察根的起源、分枝与变态。根系可以提供证据，却很少单独决定科名。',figure:'主根、侧根、不定根、根状茎、块茎与块根比较图',focus:'会区分直根系、须根系、不定根；用节、芽和叶痕判断地下器官是否为茎。',body:[['直根系与须根系','主根明显并持续伸长，侧根从主根分出，常构成直根系。许多草本植物以不定根为主，形成须根系。这是常见模式，不是区分全部双子叶与单子叶的万能规则。'],['不定根与气生根','不定根从茎、叶等非根组织发生；某些榕属植物的气生根由枝条伸出，接触土壤后可能增粗。形态受环境影响，应观察植株多个部位。'],['地下茎不是根','根状茎和块茎虽然在地下，仍可能具有节、节间、芽与退化叶；真正的根通常不形成这样的节与叶芽序列。'],['记录方法','尽量不挖掘野生植物。优先观察地表露出的根、栽培标本或经许可的教学样品。']],cues:[['主根','胚根延续形成的主轴'],['侧根','由根分出的分支'],['不定根','非根器官发生的根'],['根状茎','具节、芽的地下茎']],question:'面前的“地下块状器官”有节或芽吗？若看不见，就标为“不能确定”，不要强行归类。'};
const stemLesson={id:'stem-study',title:'茎、节、芽与生活型',en:'STEM, NODES & GROWTH FORM',tag:'第三章 · 茎与枝',lead:'茎的节、芽、枝条排列和木质化程度，比单看植株高矮更适合做辨认记录。',figure:'节、节间、叶痕、腋芽、茎刺及气生根对照图',focus:'识别草质茎与木质茎、枝条的节和叶痕；区别刺的来源，记录攀援与匍匐等生长方式。',body:[['节与节间','茎的节常与叶和芽的位置相关，相邻节之间为节间；禾本科的秆常有醒目的节，节间在许多种类中中空。'],['芽与叶痕','腋芽生在叶腋，有助于判断单叶、复叶及小叶的区别。落叶后可留下叶痕，部分树木可据此辅助辨认。'],['生活型','观察乔木、灌木、草本、藤本与水生生长型，但这些不是严格互斥的科级分类标签。'],['刺与气生根','茎刺、叶刺和皮刺的发生来源不同。观察榕树的气生根时，还需对照枝叶和隐头花序，不能一见气生根便断定桑科。']],cues:[['节','叶或芽通常着生处'],['节间','相邻两节的部分'],['腋芽','位于叶腋的芽'],['生活型','生长方式和木质化状态']],question:'找一段枝条，同时记录三个节、叶序、芽的位置与是否具有特殊附属结构。'};
const fruitLesson={id:'fruit-seed',title:'果实、种子与传播',en:'FRUITS, SEEDS & DISPERSAL',tag:'第八章 · 果实',lead:'很多科的区分依赖成熟果实与种子。它们往往比花色更稳定，也更容易在不同季节找到。',figure:'荚果、颖果、蒴果、瘦果与聚合果图版',focus:'辨别果实与种子、真果与假果；理解荚果、颖果和菊科瘦果状果实在鉴定中的意义。',body:[['果实的起源','典型果实来自开花植物的子房，可能由花托等组织共同参与形成。并非每一个肉质的“果子”都只由子房构成。'],['禾本科的颖果','颖果是禾本科常见果实类型，果皮与种皮紧贴。水稻的稻谷还被内外稃等结构包围。'],['豆科的荚果','荚果是豆科典型特征，通常由单心皮发育，成熟时开裂形式有差异；不能仅凭“三片叶”断定豆科。'],['隐头花序与莲蓬','榕果源于独特的隐头花序，荷的莲蓬是膨大的花托，其内着生多个小坚果；这些结构适合在野外与叶形交叉核实。']],cues:[['颖果','禾本科的典型果实'],['荚果','豆科典型果实'],['头状花序','菊科常见的花序结构'],['花托','承载花部的轴端结构']],question:'你能区分所见结构究竟是一颗果实、一枚种子，还是一整组花和果吗？'};
const keyLesson={id:'taxonomic-method',title:'从形态证据到科名',en:'FROM CHARACTER TO FAMILY',tag:'第九章 · 科级鉴定法',lead:'形态检索表不是猜谜，而是用互相独立的特征不断排除不符合的候选分类群。',figure:'两歧检索表、特征矩阵与证据记录卡',focus:'掌握性状、性状状态、两歧检索和交叉验证；知道何时必须停止判断。',body:[['什么是检索表','检索表的每一步列出可观察、尽量互斥的性状状态。选择符合当前植株的一项，再前往下一步骤或候选类群。'],['为何不能只看根或叶','类似叶形可能独立出现在不同科；根系也受环境影响。科级鉴别通常需联合营养性状与繁殖性状，尤其是花、果、孢子囊群或球果。'],['由科再到种','查出候选科后，先翻到科级页面，核对共有特征，再逐种比较叶序、花序、果实、生境与变异。'],['不确定时怎么做','缺少关键结构时，应停留在候选科或更高分类阶元，记录待观察性状。不能让程序以似是而非的确定答案替代证据。']],cues:[['性状','可比较的形态特征'],['状态','性状的具体表现'],['两歧检索','逐项排除的方法'],['交叉验证','用另一组特征复核']],question:'在野外观察时，写下至少两项互不重复的证据，再决定是否继续到种级。'};
lessons.splice(lessons.findIndex(x=>x.id==='stem-root'),1,rootLesson,stemLesson);
lessons.splice(lessons.findIndex(x=>x.id==='method'),0,fruitLesson,keyLesson);

 {id:'lauraceae',name:'樟科',latin:'Lauraceae',order:'樟目 Laurales',members:['camphor'],summary:'多为乔木或灌木，常含芳香物质，叶常互生，花一般较小；果实常为核果。',traits:[['生活型','木本为主'],['叶','多为单叶，叶序常互生'],['花果','小花；核果常见']],confusion:'离基三出脉是樟这一物种很实用的线索，不能当作整个樟科的共同特征。'},
 {id:'moraceae',name:'桑科',latin:'Moraceae',order:'蔷薇目 Rosales',members:['banyan'],summary:'多木本，常有乳汁；花序形态多样。榕属具有特殊的隐头花序。',traits:[['枝叶','多为木本，常可见乳汁'],['花序','形式多样，榕属具隐头花序'],['核验要点','叶、花序与成熟果序']],confusion:'气生根并非桑科独有；“榕果”也不能概括桑科所有属。'},

];

 flower:{q:'花序或果实最明确的组合特征是什么？',opts:[['许多小花密集成一个头状花序，外围有总苞','family:asteraceae'],['小穗、叶鞘与叶舌，成熟可见颖果','family:poaceae'],['蝶形小花与三出叶，后续可见荚果','family:fabaceae'],['三片倒心形小叶与五瓣小花、蒴果','family:oxalidaceae'],['盾状圆叶，大型花，莲蓬状花托','family:nelumbonaceae'],['树木上有榕果状隐头花序','family:moraceae'],['对生叶、小型常四裂的花冠；部分有芳香','family:oleaceae'],['常绿木本，具离基三出脉，开小花并结核果','family:lauraceae'],['掌状复叶，树干可具刺，大型五瓣红花','family:malvaceae'],['木本互生叶，多枚花被片与雄蕊的大花','family:magnoliaceae'],['以上均不符合或看不清','unknown']]},
 leaf:{q:'叶片与整根枝条符合下列哪一组？',opts:[['扇形叶，叶脉反复二歧分叉','family:ginkgoaceae'],['针叶成束，并能核对球果','family:pinaceae'],['蕨叶，成熟叶背具孢子囊群','family:polypodiaceae'],['大型盾状叶，叶柄着生于叶片内部','family:nelumbonaceae'],['狭长叶片、叶鞘包茎、可见叶舌','family:poaceae'],['掌状复叶、木质树干可能有刺','family:malvaceae'],['三出复叶，即三个小叶','trifoliate'],['对生常绿叶，并可观察小型四裂花','family:oleaceae'],['叶片近叶基发出三条强脉，兼具小花与核果','family:lauraceae'],['只有普通阔叶，没有可靠的花果信息','unknown']]},

const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const st=(s)=>escapeHtml(s);

const meta=(k,n='THE NATURALIST’S NOTEBOOK')=>`<div class="pagemeta"><span>${st(n)}</span><span>${st(k)}</span></div>`;
const foot=(i)=>`<footer class="pagefoot"><span>PLANTAE · FIELD NOTES</span><span class="folio">${String(i+1).padStart(2,'0')}</span><span>VOL. I · MMXXVI</span></footer>`;
const frame=(caption,sub='ILLUSTRATION RESERVED')=>`<div><div class="figslot" role="img" aria-label="预留插图位置：${st(caption)}"><div class="figinner"><div class="figglyph">✳</div><span>手绘图稿待插入</span><small>${st(sub)}</small><span style="font-size:14px;letter-spacing:1px">${st(caption)}</span></div></div><div class="figure-caption">PLATE · ${st(caption)}</div></div>`;
function cover(i){return `<article class="page cover">${meta('VOL. I / FRONTISPIECE')}<div class="cover-marker">I · 植</div><div class="overline">A PERSONAL NATURAL HISTORY</div><h1>草木观察录</h1><div class="english">BOTANICAL FIELD NOTES</div><div class="subtitle">写给愿意俯身观察的人</div><div class="cover-frame"><div class="cover-no">PLATE NO. 001</div><div class="cover-slot">为第一幅手绘植物图留白</div><small>SPECIMEN DRAWING TO BE ADDED</small></div><p class="cover-quote">“认识一株植物，是从第一次认真看它开始。”</p><button class="start" data-go="contents">翻开这本书　→</button><div class="cover-bottom"><span>VOL. I · PLANTAE</span><span>AN OPEN FIELD BOOK · 2026</span></div>${foot(i)}</article>`}
function contents(i){const sections=[['卷首',['cover','contents','preface']],['第一编 · 植物学基础',lessons.map(l=>l.id)],['第二编 · 野外检索',['key-intro','identification']],['第三编 · 科与种',['family-index']],['观察与跋',['fieldcard','afterword']]];return `<article class="page">${meta('INDEX / CONTENTS')}<h2 class="page-title">目　录</h2><div class="page-subtitle">CONTENTS · FIELD BOTANY</div><p class="toc-intro">先学习器官与性状，再使用野外检索表找到候选的科；翻到科页之后，继续逐种核对。本书的完整科级索引位于第 ${String(idxById['family-index']+1).padStart(2,'0')} 页。</p><div class="double-rule"></div>${sections.map(([heading,ids])=>`<section class="toc-section"><h3>${heading}</h3>${ids.map(id=>{const k=idxById[id],pg=bookPages[k];return `<button class="toc-row" data-go="${pg.id}"><strong>${st(pg.title)}</strong><span class="dots"></span><em>${String(k+1).padStart(2,'0')}</em></button>`}).join('')}</section>`).join('')}<p class="marginal" style="margin-top:24px">翻页：键盘 ← →　｜　返回目录：顶部「目录」按钮</p>${foot(i)}</article>`}
function preface(i){return `<article class="page">${meta('FOREWORD / VOL. I')}<h2 class="page-title">写在出发之前</h2><div class="page-subtitle">A NOTE TO THE READER</div><div class="double-rule"></div><p class="lead">这不是一本把植物名字排成清单的书，而是一本教你如何辨认的书。</p><div class="prose"><p>看到一株陌生植物时，先记录它的根、茎、叶、花、果实或孢子结构。学习相关形态术语，区分可观察的事实与暂时的推测；再用检索表逐项缩小范围。</p><p>全书遵循植物学工具书的工作顺序：形态学基础、野外检索、科级特征页、该科物种逐条核对。书中的每个科都可以像纸质植物志一样按页码抵达，科页后紧接本册已收录的物种。</p><p>目前仅覆盖十三个科、十三个示例物种。因此检索结果是“本册候选”，绝非全植物界的唯一答案。无花无果、器官缺失或性状相互矛盾时，应暂停判断，继续观察。</p></div><div class="notebox"><strong>野外观察的底线</strong><p>不为辨认而擅自挖根、折枝或采集受保护植物；只在安全和获许可的情况下观察地下结构。不能用本书判断野生植物是否可食或药用。</p></div>${foot(i)}</article>`}
function keyIntro(i){return `<article class="page">${meta('METHOD / FIELD KEY')}<h2 class="page-title">形态检索表的用法</h2><div class="page-subtitle">HOW TO IDENTIFY A FAMILY</div><p class="lead">从根、茎、叶到花与果——一条证据只能提示方向，多条相互独立的证据才能支持判断。</p><div class="double-rule"></div><div class="prose"><p><b>第一步：定结构。</b>找到真正的叶和小叶，观察茎的节、芽与叶痕；如果看见繁殖器官，分清孢子囊群、球果、花序和果实。</p><p><b>第二步：选性状。</b>对照实际观察，选择与之匹配的一组描述。根系形态、叶形或香味都可能在多个科中重复出现，因此程序要求尽量使用组合特征。</p><p><b>第三步：到科页。</b>系统会把你引到一个候选科。在那里复核科级典型性状，注意哪些特征只适用于本册示例种，不适用于整个科。</p><p><b>第四步：往下翻。</b>科页后就是对应物种的详细描述。比较叶、花果、分布以及可能的混淆，确认是否属于本册物种。</p></div><div class="notebox"><strong>适用范围</strong><p>这一版是为本册十三个科设计的<span>教学型多分支检索</span>，不是地区植物志的完整两歧检索表。无法判断时请使用「证据不足」，不要勉强选择相似项。</p></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin:24px 0"><button class="start" data-go="identification">开始形态检索 →</button><button class="filter-pill" data-go="family-index">直接查看科索引</button></div>${frame('形态分支检索示例','DICHOTOMOUS KEY — PLATE RESERVED')}${foot(i)}</article>`}
function identification(i){let content;if(keyNode.startsWith('family:')){let f=families.find(x=>x.id===keyNode.slice(7));content=f?`<div class="key-result"><div class="minor-note">初步检索结果 · 需交叉验证</div><h3>${st(f.name)} <small style="font:italic 14px Georgia">${st(f.latin)}</small></h3><p>${st(f.summary)}</p><p class="minor-note">这只是本册十三科范围内的候选，不代表已经确定植物的科名或物种。</p><button class="key-link" data-go="family-${f.id}">翻到 ${st(f.name)} · 第 ${String(idxById['family-'+f.id]+1).padStart(2,'0')} 页 →</button></div>`:''}else if(keyNode==='unknown'){content=`<div class="key-result"><h3>目前证据不足</h3><p>仅凭叶色、根系形状或生活型无法可靠确定科名。建议记录至少两组特征，特别是花、果、孢子囊群或球果，等待进一步观察。</p><button class="key-link" data-go="fieldcard">翻到观察卡，记录待核验信息 →</button></div>`}else{const n=keyNodes[keyNode]||keyNodes.start;content=`<h3 class="key-question">${st(n.q)}</h3><div class="key-options">${n.opts.map(([txt,id])=>`<button class="key-option" data-key-next="${id}">${st(txt)}　↗</button>`).join('')}</div>`}return `<article class="page">${meta('IDENTIFICATION / STEP BY STEP')}<div class="section-kicker">FIELD KEY · LIMITED TO THIS VOLUME</div><h2 class="page-title">形态检索</h2><div class="page-subtitle">FROM CHARACTER TO FAMILY</div><p class="lead">先选择观察到的器官，再根据结构组合逐步抵达科页。无法判断时，保留不确定结论。</p><div class="key-frame"><div class="key-path">当前步骤 ${keyHistory.length+1}　·　${keyHistory.length?'可返回上一步重新核对':'请从可靠的证据开始'}</div>${content}<div class="key-actions"><button class="key-back" data-key-back ${!keyHistory.length?'disabled':''}>← 返回上一步</button><button class="key-back" data-key-reset>重新开始</button><button class="key-back" data-go="family-index">全部科名索引</button></div></div><div class="notebox"><strong>鉴定并非猜测</strong><p>科内形态多样，检索表描述的是本册样本能用的组合特征。识别结果必须在科页面和物种页再次核对；本书不能替代完整植物志。</p></div>${foot(i)}</article>`}
function familyIndex(i){return `<article class="page">${meta('FAMILY INDEX / XIII')}<h2 class="page-title">科级索引</h2><div class="page-subtitle">INDEX FAMILIARUM · THIRTEEN FAMILIES</div><p class="lead">每一个科自成一页，后面紧接其收录的物种。可以从检索表抵达，也可以直接按页码寻找。</p><div class="double-rule"></div><div class="family-index">${families.map(f=>`<button data-go="family-${f.id}"><span>${st(f.name)}<small>${st(f.latin)}</small></span><span class="foliolabel">${String(idxById['family-'+f.id]+1).padStart(2,'0')}</span></button>`).join('')}</div><div class="notebox"><strong>关于“科”的页码</strong><p>页码随着新科和新物种自动重新编号；章节间的跳转始终使用固定 ID。此处列出的不是世界上全部植物科。</p></div>${foot(i)}</article>`}
function familyPage(f,i){const memberPages=f.members.map(id=>({p:plants.find(x=>x.id===id),idx:idxById[id]}));return `<article class="page">${meta('FAMILY / '+st(f.latin),'BOTANICAL FLORA')}<div class="section-kicker">PART THREE · FAMILY ACCOUNT</div><h2 class="page-title">${st(f.name)}</h2><div class="page-subtitle">${st(f.latin)} · ${st(f.order)}</div><div class="breadcrumbs"><button data-go="family-index">科级索引</button>　/　${st(f.name)}</div><div class="double-rule"></div><p class="lead">${st(f.summary)}</p><h3 class="inkheading">科级形态线索</h3><div class="family-traits">${f.traits.map(([h,t])=>`<div class="cue"><b>${st(h)}</b><span>${st(t)}</span></div>`).join('')}</div>${frame(f.name+' · 代表性根、茎、叶、花（果）形态','FAMILY BOTANICAL PLATE RESERVED')}<h3 class="inkheading">容易混淆的地方</h3><p>${st(f.confusion)}</p><h3 class="inkheading">本册已收录的物种</h3><div class="chapter-guide">从此页继续向后翻阅，逐种比对形态和生境：</div>${memberPages.map(({p,idx})=>`<button class="family-specimen" data-go="${p.id}"><span>${st(p.name)} <small>${st(p.latin)}</small></span><small>第 ${String(idx+1).padStart(2,'0')} 页　→</small></button>`).join('')}<div class="notebox"><strong>复核要求</strong><p>同一科可能包含形态差异很大的物种；请将本页的科级描述和物种页的诊断特征分开使用。</p></div>${foot(i)}</article>`}
function lesson(l,i){return `<article class="page">${meta(l.tag,'COURSE / FIELD BOTANY')}<div class="section-kicker">PART ONE · STUDY THE FORMS</div><h2 class="page-title">${st(l.title)}</h2><div class="page-subtitle">${st(l.en)}</div><div class="double-rule"></div><p class="lead">${st(l.lead)}</p><div class="lesson-layout"><div><div class="notebox"><strong>这一课要学什么</strong><p>${st(l.focus)}</p></div><h3 class="inkheading">沿着线索观察</h3><div class="prose">${l.body.map(([h,b])=>`<p><b style="color:#58644f;font-weight:600">${st(h)}。</b>${st(b)}</p>`).join('')}</div></div>${frame(l.figure,'MORPHOLOGICAL STUDY')}</div><h3 class="inkheading">形态词汇速记</h3><div class="cue-grid">${l.cues.map(([h,b])=>`<div class="cue"><b>${st(h)}</b><span>${st(b)}</span></div>`).join('')}</div><div class="notebox"><strong>写在观察本上</strong><p>${st(l.question)}</p></div>${foot(i)}</article>`}
function catalog(i){return `<article class="page">${meta('SPECIMEN INDEX / XIII')}<div class="section-kicker">PART TWO · THE SPECIMEN CABINET</div><h2 class="page-title">物种索引</h2><div class="page-subtitle">THIRTEEN ORDINARY WONDERS</div><p class="lead">从银杏到水稻。选择一类植物，翻开它的标本记录。</p><div class="double-rule"></div><div class="index-filter" id="filterBar">${['全部','乔木','草本','裸子','被子','蕨类','水生'].map(t=>`<button class="filter-pill ${activeFilter===t?'active':''}" data-filter="${t}">${t}</button>`).join('')}</div><div class="spec-index" id="specIndex">${catalogCards()}</div><div class="notebox"><strong>关于图鉴的范围</strong><p>这里提供学习用的入门特征，不是严格的检索表。某些种存在栽培变异或近缘相似种；要作种级鉴定，仍须核对可靠植物志、标本馆和当地分布信息。</p></div>${foot(i)}</article>`}
function catalogCards(){const arr=plants.filter(p=>activeFilter==='全部'||p.tags.includes(activeFilter)||p.type.includes(activeFilter));return arr.length?arr.map((p,j)=>`<button class="spec-card" data-go="${p.id}"><b>${st(p.name)}</b><span>${st(p.tags[0])}</span><i>${st(p.latin)}</i></button>`).join(''):`<p class="empty">暂时没有符合条件的条目。</p>`}
function plant(p,i){const f=getFamily(p);return `<article class="page">${meta(`SPECIMEN NO. ${String(plants.indexOf(p)+1).padStart(3,'0')}`,'BOTANICAL ENCYCLOPEDIA')}<div class="breadcrumbs"><button data-go="family-index">科索引</button>　/　<button data-go="family-${f.id}">${st(f.name)}</button>　/　${st(p.name)}</div><div class="section-kicker">PART THREE · SPECIES IN FAMILY</div><div class="species-hero"><h2 class="page-title">${st(p.name)}</h2><span class="latin">${st(p.latin)}</span></div><div class="species-sub">${st(f.name)} ${st(f.latin)}</div><div class="stamps">${p.tags.map(t=>`<span class="stamp">${st(t)}</span>`).join('')}<span class="stamp">${st(p.type)}</span></div><div class="double-rule"></div><div class="spec-layout"><div>${frame(p.look,'BOTANICAL PLATE — PENDING')}<p class="marginal" style="margin:12px 0">图版预留：待统一插入经授权的博物学手绘图片。</p></div><div><div class="fieldline"><label>生境与分布</label><p>${st(p.habitat)}</p></div><div class="fieldline"><label>叶与枝</label><p>${st(p.leaf)}</p></div><div class="fieldline"><label>花、果与繁殖</label><p>${st(p.flower)}</p></div></div></div><h3 class="inkheading">在本册中辨认此种的三个线索</h3><div class="keypoints"><ol>${p.key.map(x=>`<li>${st(x)}</li>`).join('')}</ol></div><p class="specfootnote">观察者批注：${st(p.note)}</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px"><button class="filter-pill" data-go="family-${f.id}">← 返回${st(f.name)}</button><button class="filter-pill" data-go="identification">重新形态检索</button></div>${foot(i)}</article>`}
function fieldcard(i){return `<article class="page">${meta('FIELD RECORD / BLANK')}<h2 class="page-title">空白观察卡</h2><div class="page-subtitle">LEAVE A SPACE FOR WONDER</div><p class="lead">你可以将本页打印出来，也可以仿照这些字段在纸笔中做记录。</p><div class="double-rule"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:13px 28px;margin:28px 0">${[['记录编号','No. ______'],['观察日期','____ / ____ / ____'],['观察地点','________________'],['可能名称','________________'],['生境与天气','________________'],['叶序与叶形','________________'],['花或孢子结构','________________'],['待核实之处','________________']].map(([a,b])=>`<div class="fieldline"><label>${a}</label><p style="color:#99896b">${b}</p></div>`).join('')}</div>${frame('现场速写／照片编号','YOUR OWN BOTANICAL PLATE')}<div class="notebox"><strong>永远保留两栏</strong><p>我亲眼看见了什么？／我据此推测了什么？</p></div>${foot(i)}</article>`}
function afterword(i){return `<article class="page">${meta('COLOPHON / LAST PAGE')}<h2 class="page-title">此页之后</h2><div class="page-subtitle">AN OPEN-ENDED NATURAL HISTORY</div><div class="double-rule"></div><p class="finalnote">草木不会因为被命名，<br>就停止生长。<br>这本书也一样。</p><div class="inkheading">制作与授权说明</div><div class="credits"><p>本书第二版采用独立 HTML、原生 CSS 和 JavaScript 写成。泛黄纸张、书页装饰及排版为项目内自制 CSS，没有使用第三方纸张图片。所有植物插画位置暂为空白，待收到经授权的手绘图后再逐张插入。</p><p>在线时可加载 Google Fonts 上的 <a href="https://github.com/googlefonts/longcang" target="_blank" rel="noopener noreferrer">Long Cang（龙藏）</a> 与 <a href="https://github.com/googlefonts/mashanzheng" target="_blank" rel="noopener noreferrer">Ma Shan Zheng（马善政）</a>，二者为 SIL Open Font License 1.1。离线时使用设备已安装的中文楷体回退。项目没有重新分发字体文件。</p><p>参考素材：<a href="https://github.com/lxgw/LxgwWenKai" target="_blank" rel="noopener noreferrer">霞鹜文楷（SIL OFL 1.1）</a> 可作为今后的正文备选；<a href="https://github.com/rough-stuff/rough" target="_blank" rel="noopener noreferrer">Rough.js（MIT）</a> 可用于后续形态学草图。本版没有集成、复制它们的源码或字体文件。</p><p>本册检索表仅覆盖十三科，科级识别必须复核多个形态性状，并非通用物种鉴定器。植物条目为面向初学者的概览，学名与分类需随权威植物名录更新核对。建议核查 <a href="https://powo.science.kew.org/" target="_blank" rel="noopener noreferrer">Kew Plants of the World Online</a> 与各地植物志。不可据此辨认可食、药用或有毒植物。</p><p>文字与网页实现：作为项目原创内容发布，建议仓库采用 MIT 许可证；未来外部插画须分别记录作者、来源与授权方式。</p></div><div class="rule"></div><p class="marginal" style="text-align:right">THE END — AND THE BEGINNING OF YOUR NEXT WALK</p>${foot(i)}</article>`}
function pageMarkup(i){const pg=bookPages[i];if(!pg)return '';if(pg.id==='cover')return cover(i);if(pg.id==='contents')return contents(i);if(pg.id==='preface')return preface(i);if(pg.id==='key-intro')return keyIntro(i);if(pg.id==='identification')return identification(i);if(pg.id==='family-index')return familyIndex(i);if(pg.id.startsWith('family-'))return familyPage(families.find(f=>('family-'+f.id)===pg.id),i);if(pg.id==='fieldcard')return fieldcard(i);if(pg.id==='afterword')return afterword(i);const l=lessons.find(x=>x.id===pg.id);if(l)return lesson(l,i);const p=plants.find(x=>x.id===pg.id);if(p)return plant(p,i);return ''}
let current=0;
function go(i,opts={}){i=Math.max(0,Math.min(bookPages.length-1,Number(i)||0));current=i;const p=bookPages[i];document.getElementById('pageRoot').innerHTML=pageMarkup(i);document.getElementById('pageCounter').textContent=`${String(i+1).padStart(2,'0')} / ${String(bookPages.length).padStart(2,'0')}`;document.getElementById('chapterTrail').textContent=`${p.group||'书页'} · ${p.title}`;document.getElementById('prevBtn').disabled=i===0;document.getElementById('nextBtn').disabled=i===bookPages.length-1;const prog=((i+1)/bookPages.length*100)+'%';document.getElementById('bottomProgress').style.setProperty('--progress',prog);const save=document.getElementById('saveBtn');save.classList.toggle('selected',bookmarks.has(p.id));save.setAttribute('aria-label',bookmarks.has(p.id)?'取消收藏当前页':'收藏当前页');if(!opts.noHash)history.replaceState(null,'','#'+encodeURIComponent(p.id));if(!opts.stay)window.scrollTo({top:0,behavior:'instant'})}
function navigate(id){if(id in idxById)go(idxById[id])}
function search(query){const terms=query.trim().toLocaleLowerCase();const root=document.getElementById('searchResults');if(!terms){root.innerHTML='<div class="empty">输入叶序、花序、植物名称或拉丁学名，检索整册书。</div>';return}let matches=bookPages.map((p,i)=>{const l=lessons.find(x=>x.id===p.id),x=plants.find(x=>x.id===p.id),f=families.find(x=>('family-'+x.id)===p.id);const text=[p.title,p.en,JSON.stringify(l||''),JSON.stringify(x||''),JSON.stringify(f||'')].join(' ').toLocaleLowerCase();return {p,i,text}}).filter(x=>x.text.includes(terms));root.innerHTML=matches.length?matches.map(x=>`<button class="search-hit" data-go="${x.p.id}"><strong>${st(x.p.title)}</strong><small>${st(x.p.en)}</small></button>`).join(''):'<div class="empty">未找到匹配的章节。可以尝试更宽泛的词语。</div>'}
function openSearch(){document.getElementById('searchPanel').classList.remove('hidden');document.getElementById('searchInput').focus();search(document.getElementById('searchInput').value)}
function closeSearch(){document.getElementById('searchPanel').classList.add('hidden');document.getElementById('searchBtn').focus()}
function persist(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function applySettings(){document.documentElement.style.setProperty('--size',String(fontsize));document.body.classList.toggle('paper-bright',paperTone===1);document.body.classList.toggle('paper-white',paperTone===2);document.getElementById('toneBtn').title=['旧纸','浅纸','白纸'][paperTone]+' · 点击切换纸张色调';document.getElementById('toneBtn').setAttribute('aria-label','当前'+['旧纸','浅纸','白纸'][paperTone]+'，切换纸张色调')}
function renderPrint(){const root=document.getElementById('printRoot');root.innerHTML=bookPages.map((p,i)=>`<div class="printpage">${pageMarkup(i)}</div>`).join('');root.classList.remove('hidden')}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(t){navigate(t.dataset.go);document.getElementById('searchPanel').classList.add('hidden')}const f=e.target.closest('[data-filter]');if(f){activeFilter=f.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter===activeFilter));document.getElementById('specIndex').innerHTML=catalogCards()}});
document.addEventListener('click',e=>{const opt=e.target.closest('[data-key-next]');if(opt){keyHistory.push(keyNode);keyNode=opt.dataset.keyNext;go(current,{stay:true,noHash:true});return}if(e.target.closest('[data-key-back]')&&keyHistory.length){keyNode=keyHistory.pop();go(current,{stay:true,noHash:true});return}if(e.target.closest('[data-key-reset]')){keyNode='start';keyHistory=[];go(current,{stay:true,noHash:true})}});
document.getElementById('prevBtn').addEventListener('click',()=>go(current-1));document.getElementById('nextBtn').addEventListener('click',()=>go(current+1));document.getElementById('tocBtn').addEventListener('click',()=>navigate('contents'));
document.getElementById('searchBtn').addEventListener('click',openSearch);document.getElementById('searchClose').addEventListener('click',closeSearch);document.getElementById('searchInput').addEventListener('input',e=>search(e.target.value));document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){const b=document.querySelector('.search-hit');if(b)b.click()}});
document.getElementById('searchPanel').addEventListener('click',e=>{if(e.target.id==='searchPanel')closeSearch()});
document.getElementById('fontBtn').addEventListener('click',()=>{fontsize=Math.min(1.5,Math.round((fontsize+.1)*100)/100);applySettings();persist('bf-notes-fontsize',fontsize)});document.getElementById('fontMinusBtn').addEventListener('click',()=>{fontsize=Math.max(.8,Math.round((fontsize-.1)*100)/100);applySettings();persist('bf-notes-fontsize',fontsize)});
document.getElementById('toneBtn').addEventListener('click',()=>{paperTone=(paperTone+1)%3;applySettings();persist('mj-paper-tone',paperTone)});
document.getElementById('saveBtn').addEventListener('click',()=>{const id=bookPages[current].id;bookmarks.has(id)?bookmarks.delete(id):bookmarks.add(id);persist('bf-notes-bookmarks',[...bookmarks]);go(current,{stay:true,noHash:true})});
document.getElementById('printBtn').addEventListener('click',()=>{renderPrint();window.print()});window.addEventListener('afterprint',()=>{document.getElementById('printRoot').classList.add('hidden');document.getElementById('printRoot').innerHTML=''});
document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');if(e.key==='Escape'){if(!document.getElementById('searchPanel').classList.contains('hidden'))closeSearch();return}if(typing)return;if(e.key==='/'){e.preventDefault();openSearch()}else if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}else if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}else if(e.key==='Home'&&e.ctrlKey){go(0)}else if(e.key==='End'&&e.ctrlKey){go(bookPages.length-1)}});
window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.slice(1));if(id in idxById&&idxById[id]!==current)navigate(id)});
applySettings();const initial=decodeURIComponent(location.hash.slice(1));go(initial in idxById?idxById[initial]:0,{stay:true});
</script>
</body>
</html>
