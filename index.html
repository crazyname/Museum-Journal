<script>
'use strict';
const DATA={"terms":[{"id":"term-1","group":"根与地下器官","name":"直根系","en":"Taproot system","description":"主根明显粗壮，侧根从主根两侧分出。胡萝卜和许多幼年双子叶植物可见这种根系。","parts":"主根、侧根、根尖","example":"胡萝卜"},{"id":"term-2","group":"根与地下器官","name":"须根系","en":"Fibrous root system","description":"许多细根从茎基部附近生出，粗细较接近，像一束向四周散开的线。禾本科植物常见须根系。","parts":"不定根、根群","example":"水稻"},{"id":"term-3","group":"根与地下器官","name":"支持根","en":"Prop root","description":"从茎或枝条生出，向下伸入土壤，形成额外的支撑。玉米茎下部常能看到斜伸的支持根。","parts":"茎节、入土部位","example":"玉米"},{"id":"term-4","group":"根与地下器官","name":"气生根","en":"Aerial root","description":"生长在地面以上的根。湿热地区的榕树可从枝条垂下气生根，部分气生根接触地面后逐渐增粗。","parts":"起生位置、下垂方向","example":"榕树"},{"id":"term-5","group":"根与地下器官","name":"板根","en":"Buttress root","description":"树干基部伸出宽大的板状根，像几块木板围住树干。在热带湿润森林的大乔木中较常见。","parts":"树干基部、板状扩展","example":"热带乔木"},{"id":"term-6","group":"根与地下器官","name":"根状茎","en":"Rhizome","description":"横向生长在地表附近或地下的茎，具有节、芽和叶的痕迹。竹和荷都能形成根状茎。","parts":"节、芽、节间","example":"荷"},{"id":"term-7","group":"茎与枝条","name":"木质茎","en":"Woody stem","description":"茎逐渐形成坚硬的木质部分，能够多年保持并继续增粗。树木和许多灌木的主干、枝条属于木质茎。","parts":"木质化、树皮、枝条","example":"樟树"},{"id":"term-8","group":"茎与枝条","name":"匍匐茎","en":"Creeping stem","description":"茎沿地面水平伸展，有些节上能够长出新根和新枝。白车轴草常借匍匐茎向四周扩展。","parts":"茎节、不定根","example":"白车轴草"},{"id":"term-9","group":"茎与枝条","name":"攀缘茎","en":"Climbing stem","description":"依靠缠绕、卷须、吸附根或其他结构向上生长。葡萄的卷须可以攀附周围的支撑物。","parts":"卷须、缠绕、附着","example":"葡萄"},{"id":"term-10","group":"茎与枝条","name":"节与节间","en":"Node and internode","description":"叶或分枝着生的位置称为节，相邻两节之间的茎段称为节间。竹秆的节尤其清楚。","parts":"节、节间、叶鞘","example":"竹"},{"id":"term-11","group":"叶片与叶序","name":"单叶","en":"Simple leaf","description":"一片叶只有一个完整的叶片，叶片可以有深浅不同的裂口。银杏、桂花和樟树的叶都是单叶。","parts":"叶柄、叶片、叶腋芽","example":"桂花"},{"id":"term-12","group":"叶片与叶序","name":"羽状复叶","en":"Pinnately compound leaf","description":"许多小叶沿着共同的叶轴排列，外形像一根羽毛。小叶的数量及叶轴末端有无顶生小叶，常用于进一步区分类型。","parts":"叶轴、小叶、顶生小叶","example":"含羞草、月季"},{"id":"term-13","group":"叶片与叶序","name":"掌状复叶","en":"Palmately compound leaf","description":"几枚小叶从叶柄顶端的同一点伸出，像张开的手掌。木棉的叶常由五至七枚小叶组成。","parts":"小叶共同着生点","example":"木棉"},{"id":"term-14","group":"叶片与叶序","name":"三出复叶","en":"Trifoliate leaf","description":"一片复叶由三枚小叶组成。白车轴草的小叶通常较圆，酢浆草的小叶则常呈倒心形。","parts":"小叶数量、叶轴","example":"白车轴草"},{"id":"term-15","group":"叶片与叶序","name":"扇形叶","en":"Flabellate leaf","description":"扇形叶像一把展开的扇子，叶片基部狭窄，向外逐渐展宽。银杏的叶脉从基部向外反复分叉，叶顶端常有一道缺口。","parts":"扇形轮廓、叶脉分叉","example":"银杏"},{"id":"term-16","group":"叶片与叶序","name":"披针形叶","en":"Lanceolate leaf","description":"叶片细长，中部或中部以下最宽，两端逐渐变窄，外形近似长矛的枪头。夹竹桃的叶具有典型的披针形轮廓。","parts":"最宽部位、叶尖","example":"夹竹桃"},{"id":"term-17","group":"叶片与叶序","name":"卵形叶","en":"Ovate leaf","description":"叶片基部较宽，向顶端逐渐收窄，轮廓近似鸡蛋的纵切面。记录时通常以叶柄一端为基部。","parts":"最宽部位、基部","example":"多种阔叶植物"},{"id":"term-18","group":"叶片与叶序","name":"锯齿缘","en":"Serrate margin","description":"叶缘排列着一系列向叶尖方向倾斜的小齿，形似锯齿。齿的大小、疏密与深浅因植物种类而异。","parts":"齿尖方向、齿间缺刻","example":"茶树"},{"id":"term-19","group":"叶片与叶序","name":"全缘","en":"Entire margin","description":"叶缘平滑，没有明显的齿或裂片。叶片仍可能具有弯曲的轮廓。桂花的部分叶片可呈近全缘。","parts":"叶缘连续曲线","example":"桂花"},{"id":"term-20","group":"叶片与叶序","name":"互生叶序","en":"Alternate phyllotaxy","description":"每个茎节通常只有一片叶，相邻节的叶沿枝条交替排列。樟树和榕树的叶常呈互生。","parts":"茎节、叶腋","example":"樟树"},{"id":"term-21","group":"叶片与叶序","name":"对生叶序","en":"Opposite phyllotaxy","description":"同一茎节长出两片叶，彼此相对。桂花与女贞的枝条是观察对生叶序的常见材料。","parts":"同节两叶、节间","example":"桂花"},{"id":"term-22","group":"叶片与叶序","name":"轮生叶序","en":"Whorled phyllotaxy","description":"三片或更多叶从同一茎节向四周伸出，形成一轮。夹竹桃常见三叶轮生。","parts":"同一茎节多叶","example":"夹竹桃"},{"id":"term-23","group":"叶片与叶序","name":"平行脉","en":"Parallel venation","description":"多条主要叶脉大致沿叶片长轴并行延伸，常见于禾本科植物。水稻狭长的叶片能够清楚展示平行脉。","parts":"纵向叶脉、叶鞘","example":"水稻"},{"id":"term-24","group":"叶片与叶序","name":"掌状脉","en":"Palmate venation","description":"几条主要叶脉从叶片基部附近呈放射状伸出，像手掌展开的手指。观察时可沿主脉追踪叶脉走向。","parts":"基部主脉、分支走向","example":"蓖麻"},{"id":"term-25","group":"花与花序","name":"辐射对称花","en":"Actinomorphic flower","description":"花可以沿通过中心的多个方向分成相似的两半。木棉和多数酢浆草属植物的花具有辐射对称特征。","parts":"花冠轮廓、对称轴","example":"酢浆草"},{"id":"term-26","group":"花与花序","name":"两侧对称花","en":"Zygomorphic flower","description":"花通常只有一个主要对称平面。豆科不少植物具有蝶形花冠，上方的旗瓣和侧面的翼瓣尤其醒目。","parts":"花冠两侧、旗瓣与翼瓣","example":"白车轴草"},{"id":"term-27","group":"花与花序","name":"总状花序","en":"Raceme","description":"花序主轴持续伸长，带柄的花沿主轴依次排列，通常下部的花先开放。油菜可见典型的总状花序。","parts":"花轴、花梗、开花顺序","example":"油菜"},{"id":"term-28","group":"花与花序","name":"头状花序","en":"Capitulum","description":"许多小花密集地生长在共同的花序托上，外观看起来像一朵大花。向日葵的黄色边缘是舌状花，中央密集着管状花。","parts":"总苞、小花、花序托","example":"向日葵"},{"id":"term-29","group":"果实与种子","name":"荚果","en":"Legume","description":"由单个心皮形成的果实，成熟时通常沿两条缝线开裂。豆科植物的荚果有扁平、圆柱形和念珠状等多种外形。","parts":"背缝线、腹缝线","example":"豌豆"},{"id":"term-30","group":"果实与种子","name":"蒴果","en":"Capsule","description":"由合生心皮形成的干果，成熟时通过裂缝、孔或盖等方式散出种子。酢浆草具有细长的蒴果。","parts":"果壁、开裂部位","example":"酢浆草"},{"id":"term-31","group":"果实与种子","name":"核果","en":"Drupe","description":"果皮分成外果皮、肉质中果皮和坚硬内果皮，内部常包着一粒种子。桃子是常见的核果。","parts":"果皮层次、果核","example":"桃"},{"id":"term-32","group":"果实与种子","name":"颖果","en":"Caryopsis","description":"禾本科常见的干果类型，果皮与种皮紧密贴合。稻谷内部的米粒对应颖果的主要部分。","parts":"稃片、果皮、种子","example":"水稻"},{"id":"term-33","group":"其他识别特征","name":"孢子囊群","en":"Sorus","description":"许多蕨类的叶背生有成群的孢子囊，常呈点状或条状排列。孢子囊群的位置与形态是识别蕨类的重要线索。","parts":"叶背、孢子囊、排列","example":"肾蕨"},{"id":"term-34","group":"其他识别特征","name":"球果","en":"Cone","description":"松、杉等裸子植物的生殖结构，常由许多鳞片沿轴排列。马尾松的雌球果成熟后木质化，鳞片间含有种子。","parts":"鳞片、轴、种子","example":"马尾松"},{"id":"term-35","group":"其他识别特征","name":"乳汁","en":"Latex","description":"某些植物的茎、叶受伤后会渗出乳白色或其他颜色的汁液。榕属植物常见乳汁，观察时避免接触眼口。","parts":"枝条伤口、乳液","example":"小叶榕"}],"families":[{"id":"polypodiaceae","name":"水龙骨科","latin":"Polypodiaceae","order":"水龙骨目 Polypodiales","members":["fern"],"summary":"多为具有根状茎的蕨类，靠孢子繁殖；孢子囊群常见于叶背。科内叶片形态变化很大。","traits":[["繁殖","孢子囊群（非花、非果）"],["营养体","蕨叶与根状茎常见"],["核验要点","观察叶背孢子囊群的位置、形状及叶脉"]],"confusion":"仅凭羽状叶不能确定水龙骨科；其他蕨类科也可能具有相似叶形。本册仅收录肾蕨作为实例。","group":"蕨类植物"},{"id":"ginkgoaceae","name":"银杏科","latin":"Ginkgoaceae","order":"银杏目 Ginkgoales","members":["ginkgo"],"summary":"现生种只有银杏。落叶木本，扇形叶有二歧分叉叶脉，裸子植物，不形成真正的果实。","traits":[["叶","扇形，二歧脉"],["繁殖","种子不包于子房内"],["核验要点","叶片轮廓与叶脉、短枝及种子结构"]],"confusion":"不要把肉质外种皮误认成被子植物的果肉。","group":"裸子植物"},{"id":"pinaceae","name":"松科","latin":"Pinaceae","order":"松目 Pinales","members":["pine"],"summary":"以乔木为主的裸子植物，通常产生球果；叶常为针形或线形。马尾松只是松科中“松属”的一个实例。","traits":[["枝叶","针状或线状叶；松属常成束"],["繁殖","木质或其他类型的球果"],["核验要点","针叶束数、球果鳞片与枝条形态"]],"confusion":"并非所有松科植物都“两针一束”；这是马尾松的关键性状，不是整个松科的定义。","group":"裸子植物"},{"id":"magnoliaceae","name":"木兰科","latin":"Magnoliaceae","order":"木兰目 Magnoliales","members":["magnolia"],"summary":"木本，多数具单叶互生；花常大而显眼，花被片、雄蕊与离生心皮数较多。","traits":[["叶","常为互生单叶"],["花","多枚花被片及雄蕊"],["果","常形成聚合果"]],"confusion":"大白花不等于木兰科；应数花部并查看枝条和果实。","group":"被子植物"},{"id":"lauraceae","name":"樟科","latin":"Lauraceae","order":"樟目 Laurales","members":["camphor"],"summary":"多为乔木或灌木，常含芳香物质，叶常互生，花一般较小；果实常为核果。","traits":[["生活型","木本为主"],["叶","多为单叶，叶序常互生"],["花果","小花；核果常见"]],"confusion":"离基三出脉是樟这一物种很实用的线索，不能当作整个樟科的共同特征。","group":"被子植物"},{"id":"nelumbonaceae","name":"莲科","latin":"Nelumbonaceae","order":"山龙眼目 Proteales","members":["lotus"],"summary":"挺水多年生草本，地下根状茎明显；叶大型、盾状，花托膨大形成典型“莲蓬”。","traits":[["生境","水生草本"],["叶","盾状大叶、叶柄连于叶片内侧"],["果","小坚果嵌于膨大花托"]],"confusion":"荷与睡莲不同科；叶的着生方式与花托是重要对照证据。","group":"被子植物"},{"id":"poaceae","name":"禾本科","latin":"Poaceae","order":"禾本目 Poales","members":["rice"],"summary":"通常具有明显节的秆、叶鞘与叶舌，花组成小穗，果实常为颖果。","traits":[["茎","秆具节与节间"],["叶","狭长叶片、叶鞘、叶舌"],["花果","小穗；常见颖果"]],"confusion":"狭长平行脉叶不限于禾本科；需看叶鞘、叶舌和小穗。","group":"被子植物"},{"id":"oxalidaceae","name":"酢浆草科","latin":"Oxalidaceae","order":"酢浆草目 Oxalidales","members":["oxalis"],"summary":"许多成员有复叶，常见三片倒心形小叶；花通常辐射对称、五基数。","traits":[["叶","部分成员三出复叶"],["花","常见五萼片与五花瓣"],["果","多见蒴果"]],"confusion":"小叶形态需结合花瓣数和蒴果，而不是与三叶草混称。","group":"被子植物"},{"id":"fabaceae","name":"豆科","latin":"Fabaceae","order":"豆目 Fabales","members":["clover"],"summary":"叶常为复叶，许多成员的果实为荚果。白车轴草具有典型蝶形花，但豆科并非所有成员都长蝶形花。","traits":[["叶","三出、羽状等复叶常见"],["花","部分类群具蝶形花"],["果","典型为荚果"]],"confusion":"三片小叶不是豆科的唯一证据；酢浆草科也有三出复叶。","group":"被子植物"},{"id":"moraceae","name":"桑科","latin":"Moraceae","order":"蔷薇目 Rosales","members":["banyan"],"summary":"多木本，常有乳汁；花序形态多样。榕属具有特殊的隐头花序。","traits":[["枝叶","多为木本，常可见乳汁"],["花序","形式多样，榕属具隐头花序"],["核验要点","叶、花序与成熟果序"]],"confusion":"气生根并非桑科独有；“榕果”也不能概括桑科所有属。","group":"被子植物"},{"id":"malvaceae","name":"锦葵科","latin":"Malvaceae","order":"锦葵目 Malvales","members":["kapok"],"summary":"形态差异较大，叶常互生；不少成员有掌状脉或掌状复叶，花常五基数。","traits":[["叶","单叶或复叶，形态多样"],["花","常五基数，部分种类很大"],["核验要点","花部与果实结合枝叶"]],"confusion":"“树干有刺 + 红色大花”是木棉的线索，不是锦葵科整体定义。","group":"被子植物"},{"id":"oleaceae","name":"木犀科","latin":"Oleaceae","order":"唇形目 Lamiales","members":["osmanthus"],"summary":"多为木本，叶通常对生；花常四基数，花冠可能合生。桂花是该科的芳香花例子。","traits":[["叶序","通常对生"],["花","常见四裂花冠"],["核验要点","叶序、花冠与果实"]],"confusion":"“对生叶 + 香味”不足以确定木犀科；桂花的小花及其他结构也要核实。","group":"被子植物"},{"id":"asteraceae","name":"菊科","latin":"Asteraceae","order":"菊目 Asterales","members":["sunflower"],"summary":"最重要的特征是由许多小花紧密排列成头状花序，外围通常有总苞片。","traits":[["花序","头状花序，多朵小花"],["花部","管状花或舌状花等类型"],["核验要点","总苞、单朵小花与果实"]],"confusion":"外观看似“一朵大花”未必是单朵花；不要只凭黄色花瓣判断。","group":"被子植物"}],"plants":[{"id":"ginkgo","name":"银杏","latin":"Ginkgo biloba L.","family":"银杏科 Ginkgoaceae","type":"裸子植物","habitat":"公园、道路绿化与庭院，常见于人工栽培环境。","leaf":"扇形叶，叶脉呈二歧分叉；长枝和短枝上的叶形可能不同。","flower":"春季形成雄球花或胚珠；雌株的种子成熟时，外层呈肉质。","key":["扇形叶片，常有缺刻","叶脉反复二歧分叉","属于裸子植物而非阔叶被子植物"],"note":"观察落叶季节：银杏叶色变化并不是判断其亲缘关系的依据。","tags":["乔木","裸子","观叶"],"look":"扇形叶与二歧脉的线描标本图","familyId":"ginkgoaceae","genusId":"genus-ginkgo","genusName":"银杏属","genusLatin":"Ginkgo","genusDescription":"现存银杏属只有银杏一种。扇形叶和反复分叉的叶脉是非常醒目的特征。"},{"id":"pine","name":"马尾松","latin":"Pinus massoniana Lamb.","family":"松科 Pinaceae","type":"裸子植物","habitat":"中国南方广泛分布的山地和丘陵，也见于人工林。","leaf":"针叶通常两针一束，成簇着生于短枝。","flower":"形成雌、雄球花与球果；成熟球果内具种子。","key":["针叶通常两针一束","具有木质球果","常见常绿乔木外形"],"note":"与其他松属植物区分时，要结合针叶束数、长短与球果形态。","tags":["乔木","裸子","针叶"],"look":"两针一束的针叶与球果素描","familyId":"pinaceae","genusId":"genus-pine","genusName":"松属","genusLatin":"Pinus","genusDescription":"常绿乔木，针叶长在短枝上，通常二至五针成束。辨别松属各物种时常观察每束针叶数量、针叶长度及球果鳞片。"},{"id":"fern","name":"肾蕨","latin":"Nephrolepis cordifolia (L.) C.Presl","family":"水龙骨科 Polypodiaceae（POWO 分类处理）","type":"蕨类","habitat":"湿润、半阴环境，常见于林下、墙边或园艺栽培。","leaf":"有羽状分裂的蕨叶；小羽片沿叶轴排列。","flower":"成熟的叶片背面常出现孢子囊群，孢子成熟后随风散播。","key":["羽状叶形","成熟叶背可见孢子囊群","无真正花和果实"],"note":"不要将所有具有羽状叶的植物都认成蕨类，关键还要看孢子囊群。","tags":["草本","蕨类","观叶"],"look":"蕨叶与叶背孢子囊群细节图","familyId":"polypodiaceae","genusId":"genus-fern","genusName":"肾蕨属","genusLatin":"Nephrolepis","genusDescription":"叶通常狭长、羽状，叶背可见成行的孢子囊群。地下根状茎和匍匐枝也是观察重点。"},{"id":"lotus","name":"荷","latin":"Nelumbo nucifera Gaertn.","family":"莲科 Nelumbonaceae","type":"水生植物","habitat":"池塘、湖泊与浅水湿地，常见栽培。","leaf":"大而近圆形的盾状叶，叶柄连接于叶片内侧，叶常挺出水面。","flower":"大型花朵；花托发育后呈莲蓬状，坚果嵌于其中。","key":["盾状的大型圆叶","叶柄着生在叶片内侧","独特的莲蓬状花托"],"note":"荷与睡莲并非同一属；辨识时应同时观察叶的位置、叶柄和花部。","tags":["水生","被子","观花"],"look":"荷叶截面、叶柄与莲蓬的线描","familyId":"nelumbonaceae","genusId":"genus-lotus","genusName":"莲属","genusLatin":"Nelumbo","genusDescription":"多年生水生草本。叶柄接在近圆形叶片内部，花托成熟后形成莲蓬状结构。"},{"id":"magnolia","name":"玉兰","latin":"Magnolia denudata Desr.","family":"木兰科 Magnoliaceae","type":"被子植物","habitat":"庭院、街道绿化和植物园常见栽培。","leaf":"单叶互生，叶片通常为倒卵形至椭圆形。","flower":"大而显眼的浅色花，花被片多枚；不少地区先花后叶。","key":["春季较早出现的大花","花被片明显且排列成数轮","叶片互生"],"note":"园艺中多种木兰属植物及杂交品种统称“玉兰”，不能仅凭花色确定种。","tags":["乔木","被子","观花"],"look":"玉兰花剖面与叶形手绘图","familyId":"magnoliaceae","genusId":"genus-magnolia","genusName":"木兰属","genusLatin":"Magnolia","genusDescription":"乔木或灌木，叶通常互生。花较大，花被片、雄蕊和心皮常有多枚。"},{"id":"camphor","name":"樟","latin":"Camphora officinarum Boerh. ex Fabr.","family":"樟科 Lauraceae · 常见异名 Cinnamomum camphora","type":"被子植物","habitat":"中国南方常见常绿阔叶乔木，也广泛种作行道树。","leaf":"单叶互生，叶较革质，常见离基三出脉。","flower":"花小，淡色，成圆锥花序；果实为核果。","key":["常绿乔木","叶片常见离基三出脉","叶片揉搓常有芳香气味"],"note":"不要随意摘叶试闻，更不要通过口尝来识别植物。","tags":["乔木","被子","常绿"],"look":"离基三出脉叶与小果实线描","familyId":"lauraceae","genusId":"genus-camphor","genusName":"樟属","genusLatin":"Camphora","genusDescription":"常绿木本植物，枝叶常有香气。花较小，果为肉质核果；叶脉与花部结构可帮助辨认种类。"},{"id":"osmanthus","name":"桂花","latin":"Osmanthus fragrans (Thunb.) Lour.","family":"木犀科 Oleaceae","type":"被子植物","habitat":"庭院、公园和居民区广泛栽培。","leaf":"常绿，单叶对生；叶缘可全缘或具锯齿。","flower":"花小而芳香，常在叶腋簇生，花色因品种而异。","key":["叶序对生","小花多且芳香","常绿木本植物"],"note":"“金桂”“银桂”等园艺类群有差异；仅凭香味不足以作出种级鉴定。","tags":["灌木","被子","芳香"],"look":"对生叶、小花与枝条手绘图","familyId":"oleaceae","genusId":"genus-osmanthus","genusName":"木犀属","genusLatin":"Osmanthus","genusDescription":"常绿灌木或小乔木，叶对生。花通常较小，部分种类具有浓郁香气。"},{"id":"banyan","name":"小叶榕","latin":"Ficus microcarpa L.f.","family":"桑科 Moraceae","type":"被子植物","habitat":"华南常见城市绿化、庭院及湿热环境。","leaf":"革质单叶，通常互生；树冠茂密。","flower":"花藏于特殊的隐头花序内部，成熟后可形成似果实的榕果。","key":["革质单叶和广展树冠","在适宜条件下形成气生根","具有榕属特征性的隐头花序"],"note":"榕属种类繁多，气生根并非每一株、每一季都明显。","tags":["乔木","被子","常绿"],"look":"气生根和榕果结构素描","familyId":"moraceae","genusId":"genus-banyan","genusName":"榕属","genusLatin":"Ficus","genusDescription":"榕属植物的花藏于膨大的隐头花序内，成熟后形成常被称作榕果的结构。部分种类可生气生根。"},{"id":"kapok","name":"木棉","latin":"Bombax ceiba L.","family":"锦葵科 Malvaceae","type":"被子植物","habitat":"热带及亚热带城市公园与道路绿化，华南常见。","leaf":"掌状复叶，通常有数枚小叶；季节性落叶。","flower":"春季开大型红色至橙红色花，常在树冠叶片较少时格外醒目。","key":["掌状复叶","树干常具刺，老树可能不明显","大型红色系花朵"],"note":"树干有刺不是唯一识别特征；避免攀爬或触碰。","tags":["乔木","被子","观花"],"look":"掌状复叶、花与树干表皮线描","familyId":"malvaceae","genusId":"genus-kapok","genusName":"木棉属","genusLatin":"Bombax","genusDescription":"多为落叶乔木，叶常为掌状复叶，花较大。观察树干、花和果实时可见丰富的形态特征。"},{"id":"oxalis","name":"酢浆草","latin":"Oxalis corniculata L.","family":"酢浆草科 Oxalidaceae","type":"被子植物","habitat":"草坪边缘、花坛、墙角和道路旁常见的小型草本。","leaf":"通常三出复叶，每枚小叶呈倒心形，常见明显凹缺。","flower":"小型黄色五瓣花；有细长蒴果。","key":["三个倒心形小叶","小型黄色花","常匍匐生长"],"note":"“三片叶”并不等于豆科的三叶草；比较小叶形状和花的结构。","tags":["草本","被子","野草"],"look":"倒心形三出复叶与黄花素描","familyId":"oxalidaceae","genusId":"genus-oxalis","genusName":"酢浆草属","genusLatin":"Oxalis","genusDescription":"草本植物较常见，许多种类具有三出复叶和五瓣花。小叶形状、花色与果实可作为区分线索。"},{"id":"clover","name":"白车轴草","latin":"Trifolium repens L.","family":"豆科 Fabaceae","type":"被子植物","habitat":"草坪、路边及较湿润的开阔地。","leaf":"三出复叶，小叶通常较圆或倒卵形，表面有时出现浅色斑纹。","flower":"许多小型蝶形花密集为头状花序，通常白至淡粉色。","key":["三片较圆的小叶","小花汇集成球形花头","常有匍匐茎"],"note":"四小叶是偶发变异，不是一个独立的常见物种。","tags":["草本","被子","野草"],"look":"三小叶与球形花序手绘图","familyId":"fabaceae","genusId":"genus-clover","genusName":"车轴草属","genusLatin":"Trifolium","genusDescription":"常见三出复叶，众多小花聚集成头状花序。花序、托叶及果实特征有助于进一步分种。"},{"id":"sunflower","name":"向日葵","latin":"Helianthus annuus L.","family":"菊科 Asteraceae","type":"被子植物","habitat":"常见栽培一年生草本，农田、花圃与庭院。","leaf":"叶通常较大、粗糙，茎直立并有毛。","flower":"大型头状花序，由外围舌状花与中央管状花等构成。","key":["显眼的头状花序","中央密集小花","大叶、粗糙而直立的茎"],"note":"幼年生长期的向光性现象不等于每个成熟花盘都会跟着太阳转。","tags":["草本","被子","观花"],"look":"头状花序中舌状花与管状花剖面","familyId":"asteraceae","genusId":"genus-sunflower","genusName":"向日葵属","genusLatin":"Helianthus","genusDescription":"多为草本，具头状花序。花序由边缘的舌状花和中央的管状花等组成。"},{"id":"rice","name":"水稻","latin":"Oryza sativa L.","family":"禾本科 Poaceae","type":"被子植物","habitat":"以水田种植为主，依栽培类型和地区也有其他管理方式。","leaf":"狭长带状叶，具有叶鞘与叶舌等禾本科常见结构。","flower":"圆锥花序，结出颖果（稻谷）。","key":["狭长叶与叶鞘","节与节间清晰","抽穗后可见圆锥花序"],"note":"观测稻穗应优先获得种植者许可，不进入农田踩踏。","tags":["草本","被子","作物"],"look":"稻穗、叶鞘和叶舌的结构图","familyId":"poaceae","genusId":"genus-rice","genusName":"稻属","genusLatin":"Oryza","genusDescription":"禾本科草本，叶狭长、具叶鞘和叶舌；花组成小穗，成熟后结颖果。"}],"familyOf":{"fern":"polypodiaceae","ginkgo":"ginkgoaceae","pine":"pinaceae","rice":"poaceae","sunflower":"asteraceae","clover":"fabaceae","oxalis":"oxalidaceae","osmanthus":"oleaceae","camphor":"lauraceae","banyan":"moraceae","kapok":"malvaceae","magnolia":"magnoliaceae","lotus":"nelumbonaceae"}};

let physical=[],indexById={},lookupTexts=[];
function containerHTML(p,blocks,n,continuation){return '<article class="page" data-page="'+esc(p.id)+'"><div class="pagehead"><span>博物志 · 第一编 · 草木</span><span>'+esc(p.group)+(continuation?' · 续':'')+'</span></div><div class="pagebody">'+blocks.map(x=>x.html).join('')+'</div><div class="pagefoot"><span>BOTANICAL FIELD NOTES</span><span class="folio">'+pad(n+1)+'</span><span>B6 · 125 × 176</span></div></article>'}
function paginate(){
 physical=[];indexById={};lookupTexts=[];
 const host=document.getElementById('measure');host.innerHTML='';
 for(const p of pages){
  let segment=[],continueCount=0;
  const mount=()=>{host.innerHTML=containerHTML(p,[],physical.length,continueCount>0);return host.querySelector('.pagebody')};
  let body=mount();
  const flush=()=>{if(!segment.length)return;const number=physical.length;if(!(p.id in indexById))indexById[p.id]=number;physical.push({id:p.id,title:p.title,group:p.group,html:containerHTML(p,segment,number,continueCount>0),continued:continueCount>0});segment=[];continueCount++};
  for(const chunk of p.blocks){
   const tpl=document.createElement('template');tpl.innerHTML=chunk.html;
   const children=Array.from(tpl.content.childNodes);
   body.appendChild(tpl.content);
   if(body.scrollHeight>body.clientHeight+1 && segment.length){
     children.forEach(node=>node.remove());flush();body=mount();children.forEach(node=>body.appendChild(node));
   }
   if(body.scrollHeight>body.clientHeight+1)console.warn('Oversized content chunk',p.id,chunk.html.slice(0,65));
   segment.push(chunk);
  }
  flush();
 }
 host.innerHTML='';
 physical=physical.map((x,i)=>({...x,html:x.html.replace(/<span class="folio">\d+<\/span>/,'<span class="folio">'+pad(i+1)+'</span>')}));
 document.getElementById('printPages').innerHTML=physical.map(x=>x.html.replace('id="live-key"','data-print-key="1"')).join('');
 document.querySelectorAll('[data-print-key]').forEach(el=>{el.innerHTML='<p class="text">形态检索表可在电子书内逐步选择特征。</p><p class="note">打印版请使用书中的科级索引核对形态特征，并翻至对应科、属、种页。</p>'});
 resolveFolioLabels(document.getElementById('printPages'));
}
function resolveFolioLabels(parent){parent.querySelectorAll('[data-refpage]').forEach(el=>{const target=el.dataset.refpage;el.textContent=(target in indexById)?pad(indexById[target]+1):'—'})}
function spreadCount(){return window.innerWidth>=920?2:1}
function go(index){if(index<0)index=0;if(index>=physical.length)index=physical.length-1;const count=spreadCount();state.page=Math.floor(index/count)*count;render();}
function gotoId(id){if(!(id in indexById))return;go(indexById[id]);}
function render(){
 const spread=document.getElementById('spread');const count=spreadCount();
 const totalW=window.innerWidth-28, margin= count===2?48:0;
 const factor=Math.min(1.15, Math.max(.52,(totalW-margin-(count-1)*7)/(420*count)));
 spread.innerHTML='';
 for(let k=0;k<count;k++){
  const i=state.page+k,wrap=document.createElement('div');wrap.className='sheet'+(i>=physical.length?' is-blank':'');wrap.style.width=(420*factor)+'px';wrap.style.height=(591.36*factor)+'px';
  if(i<physical.length){wrap.innerHTML=physical[i].html;wrap.querySelector('.page').style.transform='scale('+factor+')';wrap.querySelector('.page').style.transformOrigin='0 0';}
  spread.appendChild(wrap);
 }
 resolveFolioLabels(spread);
 const keyHolder=spread.querySelector('#live-key');if(keyHolder)updateKey();
 document.getElementById('counter').textContent=pad(state.page+1)+' / '+pad(physical.length);
 document.getElementById('currentTitle').textContent=physical[state.page]?.title||'';
 document.getElementById('prev').disabled=state.page===0;
 document.getElementById('next').disabled=state.page+count>=physical.length;
 try{history.replaceState(null,'','#'+encodeURIComponent(physical[state.page]?.id||'cover'))}catch{}
}
function updateKey(){const node=KEY[state.key],target=document.getElementById('live-key');if(!target||(!node&&!state.key.startsWith('family:')))return;
 const familyId=state.key.startsWith('family:')?state.key.slice(7):null;const family=familyById[familyId];
 target.innerHTML=family?('<div class="key-path">候选科 · 本册示例范围</div><div class="key-result"><h3>'+esc(family.name)+'</h3><div class="latin">'+esc(family.latin)+'</div><p class="note">'+esc(family.summary)+'</p></div><div class="keynav"><button class="go" data-go="family-'+esc(family.id)+'">翻至科页 <span data-refpage="family-'+esc(family.id)+'"></span></button><button data-key="back">上一步</button><button data-key="reset">重新检索</button></div>'):
 ('<div class="key-path">第 '+(state.stack.length+1)+' 步 · 观察特征</div><h3>'+esc(node.q)+'</h3>'+node.opts.map(([label,to])=>'<button class="key-choice" data-key="'+esc(to)+'">'+esc(label)+'</button>').join('')+'<div class="keynav"><button data-key="back" '+(!state.stack.length?'disabled':'')+'>上一步</button><button data-key="reset">重新开始</button></div>');
 resolveFolioLabels(target);
}
function keyMove(next){if(next==='reset'){state.stack=[];state.key='start'}else if(next==='back'){state.key=state.stack.pop()||'start'}else{state.stack.push(state.key);state.key=next}updateKey()}
function search(term){const text=term.trim().toLocaleLowerCase(),list=document.getElementById('searchItems');if(!text){list.innerHTML='<p class="note">输入植物名称、科名、学名或形态术语。</p>';return;}
 const matches=physical.filter(p=>!p.continued&&(p.title+' '+p.group+' '+p.html.replace(/<[^>]*>/g,' ')).toLocaleLowerCase().includes(text)).slice(0,22);
 list.innerHTML=matches.length?matches.map(p=>'<button data-go="'+esc(p.id)+'">'+esc(p.title)+'<small>'+esc(p.group)+' · '+pad(indexById[p.id]+1)+'</small></button>').join(''):'<p class="note">没有找到相关书页。</p>';
}
function searchOpen(open){const panel=document.getElementById('searchPanel');panel.classList.toggle('open',open);if(open){document.getElementById('searchInput').focus();search(document.getElementById('searchInput').value);}}
function applyTone(){document.body.classList.toggle('tone-light',state.tone===1);document.body.classList.toggle('tone-white',state.tone===2)}
function applyFont(){document.documentElement.style.setProperty('--reader-size',state.font.toFixed(2));const id=physical[state.page]?.id||'cover';paginate();go(indexById[id]??0)}
function action(act){if(act==='toc')gotoId('contents-1');else if(act==='search')searchOpen(true);else if(act==='close-search')searchOpen(false);else if(act==='plus'||act==='minus'){state.font=Math.min(1.18,Math.max(.88,Math.round((state.font+(act==='plus'?.06:-.06))*100)/100));try{localStorage.setItem('mj-font',state.font)}catch{}applyFont();}else if(act==='tone'){state.tone=(state.tone+1)%3;try{localStorage.setItem('mj-tone',state.tone)}catch{}applyTone();}else if(act==='print'){window.print();}}
document.addEventListener('click',e=>{const act=e.target.closest('[data-act]'),link=e.target.closest('[data-go]'),key=e.target.closest('[data-key]');if(act){action(act.dataset.act);return}if(link){searchOpen(false);gotoId(link.dataset.go);return}if(key){keyMove(key.dataset.key);return}});
document.getElementById('prev').addEventListener('click',()=>go(state.page-spreadCount()));document.getElementById('next').addEventListener('click',()=>go(state.page+spreadCount()));
document.getElementById('searchInput').addEventListener('input',e=>search(e.target.value));
document.addEventListener('keydown',e=>{if(e.key==='Escape')searchOpen(false);if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();searchOpen(true)}if(document.getElementById('searchPanel').classList.contains('open'))return;if(e.key==='ArrowRight')go(state.page+spreadCount());if(e.key==='ArrowLeft')go(state.page-spreadCount())});
let widthBefore=window.innerWidth;window.addEventListener('resize',()=>{if((widthBefore>=920)!==(window.innerWidth>=920)){const id=physical[state.page]?.id; widthBefore=window.innerWidth;gotoId(id||'cover')}else{widthBefore=window.innerWidth;render()}});
applyTone();document.documentElement.style.setProperty('--reader-size',state.font.toFixed(2));paginate();const initial=decodeURIComponent(location.hash.replace(/^#/,''));gotoId(initial in indexById?initial:'cover');
</script>
